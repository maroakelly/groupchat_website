<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    main { max-width: 760px; margin: 28px auto; padding: 16px; }
    .panel { background: white; border-radius: 16px; box-shadow: 0 8px 28px #0f172a12; overflow: hidden; }
    header { background: #087f8c; color: white; padding: 22px; }
    header h1 { margin: 0 0 6px; }
    header p { margin: 0; opacity: .9; }
    #status { font-size: 13px; margin-top: 10px; }
    form { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid #e2e8f0; }
    input { min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 16px; }
    #name { width: 32%; }
    #message { flex: 1; }
    button { border: 0; border-radius: 9px; padding: 12px 16px; background: #087f8c; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #066875; }
    #messages { list-style: none; margin: 0; padding: 14px; height: 52vh; min-height: 260px; overflow-y: auto; }
    #messages li { padding: 11px 12px; margin-bottom: 9px; background: #f1f5f9; border-radius: 10px; overflow-wrap: anywhere; }
    .meta { color: #64748b; font-size: 12px; margin-bottom: 5px; }
    .message-text { white-space: pre-wrap; }
    .hint { padding: 0 16px 16px; color: #64748b; font-size: 13px; }
    @media (max-width: 540px) { main { margin: 0 auto; padding: 8px; } form { flex-wrap: wrap; } #name { width: 100%; } #message { flex: 1 1 65%; } }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <header>
        <h1>Group Chat</h1>
        <p>Send messages to everyone connected.</p>
        <div id="status">Connecting…</div>
      </header>
      <form id="chat-form">
        <input id="name" maxlength="30" placeholder="Your name" autocomplete="nickname" required>
        <input id="message" maxlength="500" placeholder="Type a message…" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
      <ul id="messages" aria-live="polite"></ul>
      <div class="hint">Messages are live while people are connected. This starter version does not save chat history.</div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("chat-form");
    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    socket.on("connect", () => status.textContent = "Connected");
    socket.on("disconnect", () => status.textContent = "Disconnected — reconnecting…");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      socket.emit("chat message", {
        name: nameInput.value,
        text: messageInput.value
      });
      messageInput.value = "";
      messageInput.focus();
    });

    socket.on("chat message", (data) => {
      const item = document.createElement("li");
      const meta = document.createElement("div");
      const text = document.createElement("div");
      meta.className = "meta";
      text.className = "message-text";
      meta.textContent = data.name + " • " + data.time;
      text.textContent = data.text;
      item.appendChild(meta);
      item.appendChild(text);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
